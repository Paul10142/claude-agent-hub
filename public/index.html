<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel-2:#161a20; --line:#232932; --line-2:#2c333d;
    --ink:#e8edf4; --ink-2:#9aa7b8; --ink-3:#68737f;
    --accent:#4f8cff; --warn:#ffb020; --good:#35c98b; --idle:#5b6675;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f7f9; --panel:#fff; --panel-2:#fafbfc; --line:#e4e8ed; --line-2:#d4dae2;
           --ink:#0e1420; --ink-2:#59636f; --ink-3:#88919d; --idle:#98a2b3; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.45;
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
  .tabs{display:flex;gap:2px;margin-left:4px}
  .tab{font:inherit;font-size:13.5px;font-weight:550;padding:5px 12px;border-radius:8px;cursor:pointer;
       background:none;border:1px solid transparent;color:var(--ink-3)}
  .tab:hover{color:var(--ink-2)}
  .tab.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .tab .b.blue{background:rgba(79,140,255,.16);color:var(--accent)}
  .tab .b{display:inline-block;margin-left:6px;font-size:11px;font-variant-numeric:tabular-nums;
          padding:0 5px;border-radius:999px;background:rgba(255,176,32,.16);color:var(--warn)}
  .todoview{flex:1;min-height:0;display:none}
  .todoview.on{display:flex}
  .todolist{flex:1;overflow-y:auto;padding:24px 28px 70px;min-width:0}
  .todoside{width:34%;min-width:300px;max-width:440px;border-left:1px solid var(--line);
            overflow-y:auto;padding:24px 22px 60px;background:var(--panel-2)}

  .titem{border-bottom:1px solid var(--line);padding:16px 0}
  .titem:first-of-type{padding-top:0}
  .titem h2{font-size:17px;font-weight:640;letter-spacing:-.02em;margin:0;line-height:1.35;
            display:flex;gap:11px;align-items:flex-start;cursor:pointer}
  .titem .num{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;min-width:26px}
  .titem .cb{flex:none;width:19px;height:19px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line-2);
             background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
             font-size:12px;color:var(--good)}
  .titem.checked .cb{border-color:var(--good);background:rgba(53,201,139,.14)}
  .titem.checked h2 .lbl{color:var(--ink-3);text-decoration:line-through}
  .titem .sec{font-size:11px;font-weight:640;letter-spacing:.07em;text-transform:uppercase;
              color:var(--ink-3);margin:0 0 6px 37px}
  .titem .body{margin:8px 0 0 37px;font-size:13.5px;color:var(--ink-2)}
  .titem .body .md p{margin:0 0 8px}
  .kind{font-size:10px;font-weight:660;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;
        border-radius:5px;flex:none;margin-top:3px}
  .kind.action{background:rgba(255,176,32,.15);color:var(--warn);border:1px solid rgba(255,176,32,.3)}
  .kind.decision{background:rgba(79,140,255,.13);color:var(--accent);border:1px solid rgba(79,140,255,.3)}
  /* The heading itself is the disclosure. Clicking it opens the detail;
     only the checkbox to its left ticks the task off. */
  .titem .lbl{cursor:pointer}
  .titem .lbl::after{content:"\25b8";color:var(--ink-3);font-size:11px;margin-left:8px;
                     display:inline-block;vertical-align:middle;transition:transform .12s}
  .titem.exp .lbl::after{transform:rotate(90deg)}
  .titem .why{display:none;margin:10px 0 0 37px;font-size:13.5px;color:var(--ink-2)}
  .titem.exp .why{display:block}
  .projbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
  .pbtn{font:inherit;font-size:12.5px;font-weight:550;padding:5px 11px;border-radius:999px;cursor:pointer;
        background:var(--panel);border:1px solid var(--line);color:var(--ink-3)}
  .pbtn:hover{color:var(--ink-2)}
  .pbtn.on{background:var(--accent);border-color:transparent;color:#fff}
  .pbtn .c{opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
  .steps{margin:10px 0 0 37px;padding:0;list-style:none;border-left:2px solid var(--line);}
  .steps li{display:flex;gap:9px;align-items:flex-start;padding:5px 0 5px 13px;font-size:13.5px;color:var(--ink-2)}
  .steps .scb{flex:none;width:16px;height:16px;margin-top:2px;border-radius:4px;border:1.5px solid var(--line-2);
              background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
              font-size:10px;color:var(--good)}
  .steps li.on .scb{border-color:var(--good);background:rgba(53,201,139,.14)}
  .steps li.on .stxt{color:var(--ink-3);text-decoration:line-through}
  .grpmeta{font-size:12px;color:var(--ink-3);margin-left:37px}
  .projhead{font-size:12px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
            margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line-2)}
  .projhead:first-child{margin-top:0}

  .donetile{margin-top:28px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .donetile summary{cursor:pointer;padding:12px 16px;font-size:13px;color:var(--ink-2);list-style:none}
  .donetile summary::-webkit-details-marker{display:none}
  .donetile summary::before{content:"▸ ";color:var(--ink-3)}
  .donetile[open] summary::before{content:"▾ "}
  .donetile ol{margin:0;padding:0 18px 14px 40px;color:var(--ink-3);font-size:13px}
  .donetile li{margin:5px 0}

  .sidehead{font-size:11.5px;font-weight:660;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .sidenote{font-size:12.5px;color:var(--ink-3);margin:0 0 12px;line-height:1.5}
  #handoff{width:100%;min-height:300px;resize:vertical;background:var(--bg);color:var(--ink);
           border:1px solid var(--line-2);border-radius:10px;padding:12px 13px;
           font-family:var(--mono);font-size:12.5px;line-height:1.6}
  #handoff:focus{outline:none;border-color:var(--accent)}
  .sidebtns{display:flex;gap:8px;margin-top:10px}
  .sideempty{color:var(--ink-3);font-size:13px;line-height:1.6}
  .todoview .md{max-width:860px}
  .todoview .md h2{font-size:16px;margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
  .todoview .md h2:first-child{border-top:0;padding-top:0;margin-top:0}
  .todoview .md h3{font-size:14px;margin:16px 0 6px}
  .todoview .md li{margin:5px 0}
  .todoview .md details{margin:4px 0 8px;color:var(--ink-2)}
  .todoview .md summary{cursor:pointer;font-size:13px;color:var(--ink-3)}
  .box{font-family:var(--mono);color:var(--warn);font-weight:700;margin-right:5px}
  .box.done{color:var(--good)}
  .tdone{color:var(--ink-3);text-decoration:line-through}
  .todohead{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .todohead h2{margin:0;font-size:19px;font-weight:660;letter-spacing:-.02em}
  .todohead .sub{font-size:12.5px;color:var(--ink-3)}
  h1{font-size:16px;font-weight:650;letter-spacing:-.02em;margin:0}
  .count{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2.4s infinite}
  .dot.off{background:#e5484d;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,201,139,.45)}70%{box-shadow:0 0 0 7px rgba(53,201,139,0)}100%{box-shadow:0 0 0 0 rgba(53,201,139,0)}}

  .split{flex:1;display:flex;min-height:0}
  .list{width:46%;min-width:340px;max-width:560px;overflow-y:auto;border-right:1px solid var(--line);padding:6px 0 40px}
  .detail{flex:1;overflow-y:auto;padding:22px 26px 60px;min-width:0}

  .sec{padding:16px 18px 5px;display:flex;align-items:center;gap:8px}
  .sec h2{margin:0;font-size:11.5px;font-weight:660;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .sec .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .sec.needs h2{color:var(--warn)}
  details.donesec{margin:14px 0 0}
  details.donesec > summary{cursor:pointer;list-style:none;padding:14px 18px 6px;
    font-size:13px;font-weight:700;color:var(--ink-2)}
  details.donesec > summary::-webkit-details-marker{display:none}
  details.donesec > summary::before{content:"\25b8  ";color:var(--ink-3);font-weight:400}
  details.donesec[open] > summary::before{content:"\25be  "}
  details.donesec > summary .n{font-weight:400;color:var(--ink-3);margin-left:6px}

  .row{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
       padding:9px 18px;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
  .row:hover{background:var(--panel-2)}
  .row.on{background:var(--panel);border-left-color:var(--accent)}
  .row.blocked{border-left-color:var(--warn)}
  .r1{display:flex;align-items:baseline;gap:8px}
  .name{font-weight:600;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r1 .t{margin-left:auto;flex:none;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .r2{font-size:12px;color:var(--ink-3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .r3{font-size:12.5px;color:var(--ink-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;font-weight:660;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;
       background:rgba(255,176,32,.15);color:var(--warn);border:1px solid rgba(255,176,32,.3);flex:none}
  .completed .name,.completed .r2,.completed .r3{opacity:.5}
  .row.stale .name{color:var(--ink-2)}
  .stale-dot{width:5px;height:5px;border-radius:50%;background:var(--line-2);flex:none;
             display:inline-block;margin-right:2px;vertical-align:middle}

  /* detail */
  .d-empty{color:var(--ink-3);display:flex;height:100%;align-items:center;justify-content:center;text-align:center}
  .d-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
  .d-title{font-size:20px;font-weight:660;letter-spacing:-.02em;margin:0}
  .d-sub{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
  .d-actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13px;font-weight:550;padding:7px 13px;border-radius:8px;cursor:pointer;
       background:var(--accent);color:#fff;border:1px solid transparent}
  .btn.ghost{background:var(--panel);color:var(--ink-2);border-color:var(--line-2)}
  .btn:active{transform:translateY(1px)}
  .block{margin-bottom:20px}
  .block.reply{border-top:1px solid var(--line);padding-top:16px}
  .block h3{font-size:11.5px;font-weight:660;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .quote{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
         white-space:pre-wrap;font-size:13.5px;color:var(--ink-2)}
  /* Markdown-rendered agent output. Flows with the page — no inner scrollbar. */
  .md{font-size:14px;color:var(--ink);line-height:1.6}
  .md h1,.md h2,.md h3{font-size:14.5px;font-weight:660;margin:16px 0 6px;letter-spacing:-.01em}
  .md p{margin:0 0 10px}
  .md ul,.md ol{margin:0 0 10px;padding-left:20px}
  .md li{margin:2px 0}
  .md code{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);
           border-radius:4px;padding:1px 5px}
  .md pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
          overflow-x:auto;margin:0 0 12px}
  .md pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.5}
  .md blockquote{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line-2);color:var(--ink-2)}
  .md a{color:var(--accent)}
  .md table{border-collapse:collapse;margin:0 0 12px;display:block;overflow-x:auto}
  .md td,.md th{border:1px solid var(--line);padding:5px 9px;font-size:13px;text-align:left}
  .md strong{font-weight:640}
  .md hr{border:0;border-top:1px solid var(--line);margin:14px 0}

  /* The question an agent is blocked on. */
  .ask{border:1px solid rgba(255,176,32,.4);background:rgba(255,176,32,.07);border-radius:10px;padding:13px 15px}
  .ask .q{font-weight:600;color:var(--ink);margin-bottom:9px}
  .ask .opt{display:flex;gap:9px;padding:4px 0;font-size:13.5px;color:var(--ink-2)}
  .ask .opt b{color:var(--ink);font-weight:600}
  .ask .k{font-family:var(--mono);color:var(--warn);flex:none}

  /* Plain callout — replaces the reply box, which could never send. */
  .callout{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;
           padding:12px 15px;color:#fff;font-size:13.5px;line-height:1.55}
  @media (prefers-color-scheme: light){ .callout{color:var(--ink)} }

  details.acts-t{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel)}
  details.acts-t summary{cursor:pointer;padding:9px 14px;font-size:12.5px;color:var(--ink-2);list-style:none}
  details.acts-t summary::-webkit-details-marker{display:none}
  details.acts-t summary::before{content:"▸ ";color:var(--ink-3)}
  details.acts-t[open] summary::before{content:"▾ "}
  details.acts-t .acts{padding:0 14px 12px}
  ul.todo{list-style:none;margin:0;padding:0}
  ul.todo li{display:flex;gap:9px;align-items:baseline;padding:4px 0;font-size:13.5px;color:var(--ink-2)}
  ul.todo .mark{font-family:var(--mono);font-size:12px;flex:none;width:14px}
  li.completed_ .mark{color:var(--good)} li.completed_ span:last-child{text-decoration:line-through;opacity:.6}
  li.in_progress .mark{color:var(--accent)} li.in_progress span:last-child{color:var(--ink);font-weight:550}
  .acts{font-family:var(--mono);font-size:12px;color:var(--ink-3);line-height:1.75}
  .acts b{color:var(--ink-2);font-weight:600}
  .note{font-size:12.5px;color:var(--ink-3);margin-top:7px}
  textarea{width:100%;min-height:78px;resize:vertical;background:var(--panel);color:var(--ink);
           border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px}
  textarea:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="tabs">
    <button class="tab on" id="tabAgents">Agents</button>
    <button class="tab" id="tabTodo">Manual<span class="b" id="todoBadge"></span></button>
    <button class="tab" id="tabDec">Decisions<span class="b blue" id="decBadge"></span></button>
  </div>
  <span class="count" id="count"></span>
  <span class="live"><span class="dot" id="dot"></span><span id="livetext">live</span></span>
</header>

<div class="split" id="agentsView">
  <nav class="list" id="list"></nav>
  <section class="detail" id="detail">
    <div class="d-empty">Select an agent to see what it's doing.</div>
  </section>
</div>

<section class="todoview" id="todoView">
  <div class="todolist" id="todoList"></div>
  <aside class="todoside">
    <h3 class="sidehead">Hand-off note</h3>
    <p class="sidenote">Tick items as you finish them. This box fills in with a message
    you can paste into any agent window &mdash; it will tick them off in the file for you.</p>
    <textarea id="handoff" spellcheck="false"></textarea>
    <div class="sidebtns">
      <button class="btn" id="copyHandoff">Copy</button>
      <button class="btn ghost" id="clearHandoff">Clear</button>
    </div>
  </aside>
</section>

<script>
const $ = (id) => document.getElementById(id);
let state = { sessions: [] };
let selected = null, detail = null, detailFor = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ms){
  if (ms == null) return '';
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 60) return s+'s';
  const m = Math.floor(s/60); if (m < 60) return m+'m';
  const h = Math.floor(m/60); return h+'h'+(m%60?' '+(m%60)+'m':'');
}
let HOME='';   // filled from the server, so no machine's path is baked in
function prettyPath(p){ if(!p) return ''; let o=p.startsWith(HOME)?'~'+p.slice(HOME.length):p;
  return o.length>52 ? o.slice(0,22)+'…'+o.slice(-27) : o; }
function projectOf(s){
  if (s.project) return s.project;
  const c = s.cwd || '';
  if (/^\/(private\/)?var\/folders\//.test(c) || c.startsWith('/tmp')) return 'scratch';
  return c ? c.split('/').filter(Boolean).pop() : 'unknown';
}
// The chat-window title if the app knows one; otherwise the task; otherwise the folder.
function nameOf(s){ return s.title_session || s.title || projectOf(s); }

// Escape-then-structure markdown. Deliberately small: no dependencies allowed,
// this page must render identically with no network.
function md(src){
  if (!src) return '';
  const blocks = [];
  let t = esc(src).replace(/```([\s\S]*?)```/g, (_, code) => {
    blocks.push(code.replace(/^[a-zA-Z0-9]*\n/, ''));
    return `\u0000${blocks.length - 1}\u0000`;
  });
  t = t.replace(/^\s*(?:---|___|\*\*\*)\s*$/gm, '<hr>');
  t = t.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>')
       .replace(/^##\s+(.*)$/gm, '<h2>$1</h2>')
       .replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
  t = t.replace(/(?:^&gt;\s?.*(?:\n|$))+/gm, (m) =>
    '<blockquote>' + m.split('\n').filter(Boolean).map(l => l.replace(/^&gt;\s?/, '')).join('<br>') + '</blockquote>');
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  // Pipe tables — agents emit these constantly, and raw pipes are unreadable.
  t = t.replace(/^\|.*\|[ \t]*\n\|[ \t:|-]+\|[ \t]*\n(?:\|.*\|[ \t]*(?:\n|$))*/gm, (m) => {
    const rows = m.trim().split('\n').map(r => r.trim());
    const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    return '<table><thead><tr>' + head.map(h => `<th>${h}</th>`).join('') +
           '</tr></thead><tbody>' +
           body.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') +
           '</tbody></table>';
  });
  t = t.replace(/^(?:[-*]|\d+\.)\s+.*(?:\n(?:[-*]|\d+\.)\s+.*)*/gm, (m) => {
    const ordered = /^\d/.test(m.trim());
    const items = m.split('\n').map(l => l.replace(/^(?:[-*]|\d+\.)\s+/, '').trim())
                   .filter(Boolean).map(i => `<li>${i}</li>`).join('');
    return ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`;
  });
  t = t.split(/\n{2,}/).map(p => {
    const x = p.trim();
    if (!x) return '';
    return /^<(h\d|ul|ol|blockquote|pre|hr|table)/.test(x) ? x : `<p>${x.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${blocks[i]}</code></pre>`);
}

const SECTIONS = [
  { key:'needsInput', label:'Needs input', cls:'needs' },
  { key:'working',    label:'Working',     cls:'' },
  { key:'completed',  label:'Completed',   cls:'' },
];

function renderList(){
  const list = state.sessions || [], t = Date.now();
  const working = list.filter(s=>s.group==='working').length;
  const needs   = list.filter(s=>s.group==='needsInput').length;
  $('count').textContent = list.length ? `${needs} need you · ${working} working · ${list.length} total` : '';
  document.title = needs ? `(${needs}) Agents — need you` : working ? `${working} working · Agents` : 'Agents';

  if (!list.length){ $('list').innerHTML = '<div class="sec"><h2>No agents running</h2></div>'; return; }

  // Needs input and Working stay as plain sections. Completed collapses into a
  // bold, closed-by-default toggle — it is reference, not something to scan.
  $('list').innerHTML = SECTIONS.map(sec => {
    const rows = list.filter(s => s.group === sec.key);
    if (!rows.length) return '';
    const body = rows.map(s => `
        <button class="row ${s.id===selected?'on':''} ${s.blocked?'blocked':''} ${s.group==='completed'?'completed':''} ${s.live?'':'stale'}"
                data-id="${esc(s.id)}" title="${s.live?'live signal':'no live signal'}">
          <div class="r1">
            ${s.live?'':'<span class="stale-dot"></span>'}
            <span class="name">${esc(nameOf(s))}</span>
            ${s.blocked?'<span class="tag">permission</span>':''}
            <span class="t">${ago(t-(s.stateAt||s.lastSeen))}</span>
          </div>
          <div class="r2">${esc(projectOf(s))}${s.branch?' \u00b7 '+esc(s.branch):''}</div>
          ${s.title?`<div class="r3">${esc(s.title)}</div>`:''}
        </button>`).join('');
    if (sec.key === 'completed')
      return `<details class="donesec"><summary>Completed<span class="n">${rows.length}</span></summary>${body}</details>`;
    return `<div class="sec ${sec.cls}"><h2>${sec.label}</h2><span class="n">${rows.length}</span></div>${body}`;
  }).join('');

  $('list').querySelectorAll('.row').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.id)));
}

async function select(id){
  selected = id; detail = null; renderList(); renderDetail();
  try {
    const r = await fetch('/api/session/'+encodeURIComponent(id));
    if (selected === id){ detail = await r.json(); detailFor = id; renderDetail(); }
  } catch {}
}

function renderDetail(){
  const s = (state.sessions||[]).find(x => x.id === selected);
  const el = $('detail');
  if (!s){ el.innerHTML = '<div class="d-empty">Select an agent to see what it&rsquo;s doing.</div>'; return; }
  const d = detailFor === selected ? detail : null;

  const askText = s.ask || null;
  const qs = d?.question || null;
  const askBlock = (qs || askText) ? `
    <div class="block"><h3>Waiting on your answer</h3>
      <div class="ask">${qs ? qs.map(q => `
        <div class="q">${esc(q.question)}</div>
        ${q.options.map((o,i) => `<div class="opt"><span class="k">${i+1}</span><span><b>${esc(o.label)}</b>${o.description?' — '+esc(o.description):''}</span></div>`).join('')}
      `).join('<hr>') : `<div class="q">${esc(askText)}</div>`}</div>
    </div>` : '';

  const todos = d?.todos?.length ? `
    <div class="block"><h3>Its to-do list</h3><ul class="todo">${d.todos.map(t=>{
      const m = t.status==='completed'?'\u2713':t.status==='in_progress'?'\u25b8':'\u25cb';
      return `<li class="${t.status==='completed'?'completed_':t.status}"><span class="mark">${m}</span><span>${esc(t.content)}</span></li>`;
    }).join('')}</ul></div>` : '';

  // No heading here: this is the bulk of the panel and the label was just noise.
  const said = d?.lastAssistant ? `
    <div class="block reply"><div class="md">${md(d.lastAssistant)}</div></div>` : '';

  const asked = (d?.lastPrompt || s.title) ? `
    <div class="block"><h3>What you asked</h3><div class="md">${md(d?.lastPrompt || s.title)}</div></div>` : '';

  const acts = d?.activity?.length ? `
    <div class="block"><details class="acts-t"><summary>Recent actions (${d.activity.length})</summary>
      <div class="acts">${d.activity.map(a=>`<b>${esc(a.tool)}</b>${a.detail?' \u2014 '+esc(a.detail):''}`).join('<br>')}</div>
    </details></div>` : '';

  el.innerHTML = `
    <div class="d-head"><h2 class="d-title">${esc(nameOf(s))}</h2>
      <span class="count">${esc(s.state)} \u00b7 ${ago(Date.now()-(s.stateAt||s.lastSeen))}</span></div>
    <div class="d-sub">${esc(projectOf(s))}${s.branch?' \u00b7 '+esc(s.branch):''} \u00b7 ${esc(prettyPath(s.cwd))}</div>
    ${askBlock}${asked}${said}${todos}${acts}`;
}

function render(){ renderList(); renderDetail(); }

// ---------------------------------------------------------------- to-do tab
let todoData = null;
const ticked = new Map();   // id -> item, survives re-renders within a session

async function loadTodo(){
  try {
    const d = await (await fetch('/api/todo')).json();
    if (!d.ok){ $('todoList').innerHTML = `<div class="d-empty">Could not read the to-do file.<br>${esc(d.error||'')}</div>`; return; }
    todoData = d;
    const tasks = (mode) => groupItems(d.items.filter(i => !i.done && i.list === mode)).length;
    $('todoBadge').textContent = tasks('action') || '';
    $('decBadge').textContent = tasks('decision') || '';
    renderTodo();
  } catch { $('todoList').innerHTML = '<div class="d-empty">Could not reach the server.</div>'; }
}

let listMode = 'action';   // which of the two lists the to-do pane is showing

let projFilter = 'all';
const expanded = new Set();   // which cards are showing their detail

// One card per TASK. A section holding several checkboxes is a multi-step
// procedure — "enable Google sign-in" was showing as nine separate chores —
// so it becomes a single card with its steps inside, each still tickable.
function groupItems(open){
  const groups = [];
  const byKey = new Map();
  for (const it of open){
    const key = `${it.project}||${it.section}`;
    if (!byKey.has(key)){
      const g = { key, project: it.project, section: it.section,
                  title: it.h3 || it.h2 || '', context: it.h3 ? it.h2 : '',
                  intro: it.intro, items: [] };
      byKey.set(key, g); groups.push(g);
    }
    byKey.get(key).items.push(it);
  }
  return groups;
}

function renderTodo(){
  const d = todoData; if (!d) return;
  const all = d.items.filter(i => !i.done && i.list === listMode);
  const projects = [...new Set(d.sources.filter(s=>s.project).map(s => s.project))];
  const open = projFilter === 'all' ? all : all.filter(i => i.project === projFilter);
  const done = d.items.filter(i => i.done && i.list === listMode
                                && (projFilter === 'all' || i.project === projFilter));
  const when = new Date(d.mtime).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

  const taskCount = (arr) => groupItems(arr).length;
  const groups = groupItems(open);
  const bar = `<div class="projbar">
    <button class="pbtn ${projFilter==='all'?'on':''}" data-p="all">All<span class="c">${taskCount(all)}</span></button>
    ${projects.map(pr => {
      const n = taskCount(all.filter(i=>i.project===pr));
      return `<button class="pbtn ${projFilter===pr?'on':''}" data-p="${esc(pr)}">${esc(pr)}<span class="c">${n}</span></button>`;
    }).join('')}
  </div>`;

  let n = 0;
  const body = groups.map(g => {
    n++;
    const multi = g.items.length > 1;
    const first = g.items[0];
    const head = multi ? g.title : first.text;
    const ctx = [g.intro, multi ? '' : first.detail].filter(Boolean).join('\n\n');
    const allTicked = g.items.every(i => ticked.has(i.id));
    return `
    <article class="titem ${allTicked?'checked':''} ${expanded.has(g.key)?'exp':''}" data-key="${esc(g.key)}">
      <div class="sec">${esc(projFilter==='all' ? g.project + ' \u00b7 ' : '')}${esc(multi ? g.context || g.section : g.section)}</div>
      <h2>
        <span class="cb" data-grp="${esc(g.key)}">${allTicked?'\u2713':''}</span>
        <span class="num">${n}.</span>
        <span class="lbl">${md(head).replace(/^<p>|<\/p>$/g,'')}</span>
      </h2>
      ${multi ? `<div class="grpmeta">${g.items.length} steps</div>
        <ul class="steps">${g.items.map(it => `
          <li class="${ticked.has(it.id)?'on':''}" data-id="${esc(it.id)}">
            <span class="scb">${ticked.has(it.id)?'\u2713':''}</span>
            <span class="stxt">${md(it.text).replace(/^<p>|<\/p>$/g,'')}</span>
          </li>`).join('')}</ul>` : ''}
      ${ctx?`<div class="why"><div class="md">${todoMd(ctx)}</div></div>`:''}
    </article>`;
  }).join('');

  $('todoList').innerHTML =
    `<div class="todohead"><h2>${listMode==='action'?'Things only you can do':'Decisions for you'}</h2>
       <span class="sub">${groups.length} open \u00b7 updated ${esc(when)}</span></div>
     <p class="sidenote" style="margin:-10px 0 16px">${listMode==='action'
        ? 'Each of these needs you at a dashboard, a console or an account. An agent cannot do them.'
        : 'None of these need you anywhere. Answer one in a sentence to any agent and it does the work.'}</p>` +
    bar +
    (open.length ? body : '<div class="d-empty">Nothing open here.</div>') +
    (done.length ? `<details class="donetile"><summary>Completed (${done.length})</summary>
       <ol>${done.map(i=>`<li>${esc(i.summary)}</li>`).join('')}</ol></details>` : '');

  $('todoList').querySelectorAll('.pbtn').forEach(b =>
    b.addEventListener('click', () => { projFilter = b.dataset.p; renderTodo(); }));
  $('todoList').querySelectorAll('.cb').forEach(b =>
    b.addEventListener('click', (e) => { e.stopPropagation(); toggleGroup(b.dataset.grp); }));
  $('todoList').querySelectorAll('.steps li').forEach(li =>
    li.addEventListener('click', () => toggleItem(li.dataset.id)));
  $('todoList').querySelectorAll('.titem > h2 > .lbl').forEach(l =>
    l.addEventListener('click', () => {
      const card = l.closest('.titem');
      const k = card.dataset.key;
      if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
      card.classList.toggle('exp');          // class flip only — no re-render
    }));
}

// Ticking used to re-render the whole list, which changed every element's
// height and threw the page around under the cursor. Now it only flips classes
// on the affected nodes — nothing moves.
function paintTicks(){
  document.querySelectorAll('.titem').forEach(card => {
    const ids = [...card.querySelectorAll('.steps li')].map(li => li.dataset.id);
    const own = ids.length ? ids : [card.dataset.key];
    const items = (todoData?.items || []).filter(i =>
      `${i.project}||${i.section}` === card.dataset.key && !i.done && i.list === listMode);
    const allOn = items.length && items.every(i => ticked.has(i.id));
    card.classList.toggle('checked', !!allOn);
    const cb = card.querySelector('h2 > .cb');
    if (cb) cb.textContent = allOn ? '\u2713' : '';
    card.querySelectorAll('.steps li').forEach(li => {
      const on = ticked.has(li.dataset.id);
      li.classList.toggle('on', on);
      li.querySelector('.scb').textContent = on ? '\u2713' : '';
    });
  });
}

function toggleGroup(key){
  const items = (todoData?.items || []).filter(i => `${i.project}||${i.section}` === key && !i.done && i.list === listMode);
  const allOn = items.every(i => ticked.has(i.id));
  items.forEach(i => allOn ? ticked.delete(i.id) : ticked.set(i.id, i));
  paintTicks(); renderHandoff();
}

function toggleItem(id){
  const it = todoData?.items.find(x => x.id === id);
  if (!it) return;
  if (ticked.has(id)) ticked.delete(id); else ticked.set(id, it);
  paintTicks();
  renderHandoff();
}

function renderHandoff(){
  const list = [...ticked.values()];
  const box = $('handoff');
  if (!list.length){ box.value = ''; box.placeholder = 'Tick an item and the message appears here.'; return; }
  box.value =
    (listMode === 'action'
      ? `I've done the following. Please tick them off in docs/HUMAN_TODO.md (mark each "- [x]" and add a one-line note of what changed), then commit and merge:\n\n`
      : `Here are my answers on these open decisions. Act on each one, then tick it off in docs/DECISIONS.md with a one-line note of what you did, and commit:\n\n`) +
    list.map((i,n)=>`${n+1}. ${i.summary}\n   file: ${i.file}${i.section?`  |  section: ${i.section}`:''}`).join('\n') +
    (listMode === 'action'
      ? `\n\nDon't change anything else in the file.`
      : `\n\n(My answer for each is above / I'll add it below.)`);
}

// Same renderer, but the file's checkbox syntax and house-style toggles survive.
function todoMd(src){
  const unescapeToggles = (h) => h
    .replace(/&lt;details&gt;/g, '<details>')
    .replace(/&lt;\/details&gt;/g, '</details>')
    .replace(/&lt;summary&gt;/g, '<summary>')
    .replace(/&lt;\/summary&gt;/g, '</summary>');
  return unescapeToggles(md(src))
    .replace(/<li>\[ \]\s*/g, '<li><span class="box">\u25a1</span>')
    .replace(/<li>\[[xX]\]\s*/g, '<li><span class="box done">\u2713</span>');
}

function showTab(which){
  const agents = which === 'agents';
  $('agentsView').style.display = agents ? 'flex' : 'none';
  $('todoView').classList.toggle('on', !agents);
  $('tabAgents').classList.toggle('on', agents);
  $('tabTodo').classList.toggle('on', which === 'todo');
  $('tabDec').classList.toggle('on', which === 'decisions');
  $('count').style.display = agents ? '' : 'none';
  if (!agents){ listMode = which === 'decisions' ? 'decision' : 'action'; loadTodo(); }
}
$('tabAgents').onclick = () => showTab('agents');
$('tabTodo').onclick   = () => showTab('todo');
$('tabDec').onclick    = () => showTab('decisions');
loadTodo();                     // populate the badge immediately
setInterval(() => {
  // Never redraw the list while items are ticked — it would move things under
  // the cursor mid-click, which is the jarring behaviour Paul reported.
  if (ticked.size) return;
  if ($('todoView').classList.contains('on') || !todoData) loadTodo();
}, 30000);
$('copyHandoff').onclick = async () => {
  const v = $('handoff').value.trim();
  if (!v) return;
  await navigator.clipboard.writeText(v);
  $('copyHandoff').textContent = 'Copied';
  setTimeout(() => { $('copyHandoff').textContent = 'Copy'; }, 1400);
};
$('clearHandoff').onclick = () => { ticked.clear(); renderTodo(); renderHandoff(); };
renderHandoff();

let es;
function connect(){
  es = new EventSource('/stream');
  es.onopen = () => { $('dot').classList.remove('off'); $('livetext').textContent='live'; };
  es.onmessage = (e) => { try { state = JSON.parse(e.data); if (state.home) HOME = state.home; render(); } catch {} };
  es.onerror = () => { $('dot').classList.add('off'); $('livetext').textContent='disconnected';
    try{es.close();}catch{} setTimeout(connect, 2000); };
}
connect(); setInterval(renderList, 1000); render();
</script>
</body>
</html>
