<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<!-- Inter matches the claude.ai to-do hub. If the network is down the system
     font takes over; nothing else on this page needs the network. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Tokens copied from the to-do hub (claude.ai artifact) so the two pages read as one product. */
  :root{
    --bg:#f6f8fc; --surface:#ffffff; --fg:#0b1a33; --muted:#51607a; --line:#bfdbfe;
    --accent:#1d4ed8; --navy:#172554; --done:#15803d; --warn:#b45309; --chip:#eff6ff;
    --warn-chip:#fffbeb; --warn-line:#fcd34d; --bad:#dc2626; --faint:#94a3b8;
    --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0a1122; --surface:#111a2e; --fg:#e6ecf7; --muted:#9aa8c2; --line:#1e3a8a;
    --accent:#7aa2ff; --navy:#c7d6ff; --done:#4ade80; --warn:#fbbf24; --chip:#162240;
    --warn-chip:#2a1e08; --warn-line:#78350f; --bad:#f87171; --faint:#475569; color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#0a1122; --surface:#111a2e; --fg:#e6ecf7; --muted:#9aa8c2; --line:#1e3a8a;
    --accent:#7aa2ff; --navy:#c7d6ff; --done:#4ade80; --warn:#fbbf24; --chip:#162240;
    --warn-chip:#2a1e08; --warn-line:#78350f; --bad:#f87171; --faint:#475569; color-scheme:dark}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
       -webkit-font-smoothing:antialiased;padding-block:24px 80px;padding-inline:16px}
  a{color:var(--accent)}
  button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  /* ---------------------------------------------------------------- header */
  header.top{display:flex;flex-direction:column;gap:6px}
  .titlebar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px}
  h1{font-size:26px;line-height:1.2;margin:0;color:var(--navy);letter-spacing:-.01em}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
        padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--done);animation:pulse 2.4s infinite}
  .dot.off{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.45)}70%{box-shadow:0 0 0 7px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
  /* Buttons and counts share the title row, so the columns start higher up. */
  .actions{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
  .hub,.tog{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
       padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;
       text-decoration:none;white-space:nowrap;cursor:pointer}
  .hub{background:var(--navy);color:var(--bg);border:0}
  .hub[hidden]{display:none}
  .hub:hover{filter:brightness(1.15)}
  .tog{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
  .tog:hover{background:var(--chip)}
  .counts{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .counts b{color:var(--fg);font-weight:600}

  /* ---------------------------------------------------------------- board */
  /* Four columns across the top half; the selected agent fills the bottom half. */
  .board{display:flex;flex-direction:column;gap:18px}
  .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
  .cols.five{grid-template-columns:repeat(5,minmax(0,1fr))}

  .group{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .gh{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
      border-bottom:1px solid var(--line)}
  .gh .t{font-weight:700;color:var(--navy);font-size:14px}
  .group.needs .gh .t{color:var(--warn)}
  .group.ready .gh .t{color:var(--done)}
  .group.bg .gh .t{color:var(--muted)}
  .group.done .gh .t{color:var(--muted)}
  .group{min-width:0}
  /* Five rows, then the column scrolls on its own. renderList measures the cap. */
  .rows{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .rows.open{max-height:none !important;overflow:visible}
  .none{padding:12px 14px;font-size:13px;color:var(--faint)}
  /* "Show All" is the column's last row, deliberately small. */
  .more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--bg);
        color:var(--accent);font:inherit;font-size:12px;font-weight:600;padding:6px 14px;min-height:30px;
        cursor:pointer;text-align:center}
  .more:hover{background:var(--chip)}
  .group.empty .gh{border-bottom:0}

  .pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;
        background:var(--chip);color:var(--accent);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
  .pill.w{color:var(--warn);background:var(--warn-chip)}
  .pill.ok{color:var(--done)}
  .pill.m{color:var(--muted)}

  .row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
       padding:9px 12px;min-height:44px;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--chip)}
  .row.on{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
  .row.blocked{box-shadow:inset 3px 0 0 var(--warn)}
  .r1{display:flex;align-items:center;gap:8px;min-width:0}
  .sd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
  .row.needs .sd{background:var(--warn)}
  .row.bg .sd{background:var(--faint)}
  .row.done .sd{background:var(--done);opacity:.55}
  .row.done .name{color:var(--muted)}
  .row.stale .sd{background:transparent;border:1.5px solid var(--faint)}
  .row.ready .sd{background:var(--done)}
  .row.ready.stale .sd{background:transparent;border-color:var(--done)}
  .row.needs.stale .sd{background:transparent;border-color:var(--warn)}
  .tag{flex:none;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);
       border-radius:6px;padding:0 5px;line-height:16px}
  .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .row.stale .name{color:var(--muted)}
  .ago{margin-left:auto;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .r2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0 0 16px}

  /* ---------------------------------------------------------------- detail */
  .detail{border:1px solid var(--line);border-radius:12px;background:var(--surface);
          padding:18px 20px 20px;min-width:0;scroll-margin-top:16px;min-height:50vh}
  .d-empty{color:var(--muted);text-align:center;padding:36px 8px;font-size:14px}
  .d-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
  .d-title{font-size:19px;line-height:1.3;margin:0;color:var(--navy);overflow-wrap:anywhere}
  .launch{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 16px;
        border-radius:10px;background:var(--navy);color:var(--bg);font-weight:600;font-size:14px;
        text-decoration:none;white-space:nowrap}
  .launch:hover{filter:brightness(1.15)}
  .d-why{font-size:14px;color:var(--fg);margin-top:8px}
  .d-why b{font-weight:600;color:var(--muted)}
  .d-todos{margin:4px 0 0;padding-left:20px}
  .d-todos li{margin:2px 0}
  .d-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin:4px 0 2px;overflow-wrap:anywhere}
  .block{margin-top:18px}
  .block.reply{border-top:1px solid var(--line);padding-top:16px}
  .block h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

  /* The question an agent is blocked on. */
  .ask{border:1px solid var(--warn-line);background:var(--warn-chip);border-radius:10px;padding:12px 14px}
  .ask .q{font-weight:600;color:var(--fg);margin-bottom:8px}
  .ask .q:last-child{margin-bottom:0}
  .ask .opt{display:flex;gap:9px;padding:3px 0;font-size:14px;color:var(--muted)}
  .ask .opt b{color:var(--fg);font-weight:600}
  .ask .k{font-family:var(--mono);color:var(--warn);flex:none}
  .ask hr{border:0;border-top:1px solid var(--warn-line);margin:10px 0}

  /* Markdown-rendered agent output. Flows with the page — no inner scrollbar. */
  .md{font-size:14.5px;line-height:1.6;color:var(--fg);overflow-wrap:break-word}
  .md h1,.md h2,.md h3{font-size:15px;font-weight:700;color:var(--navy);margin:16px 0 6px}
  .md p{margin:0 0 10px}
  .md ul,.md ol{margin:0 0 10px;padding-left:20px}
  .md li{margin:2px 0}
  .md code{font-family:var(--mono);font-size:13px;background:var(--chip);padding:0 4px;border-radius:4px;color:var(--fg)}
  .md pre{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
          overflow-x:auto;margin:0 0 12px}
  .md pre code{background:none;padding:0;font-size:12.5px;line-height:1.5}
  .md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
  .md a{color:var(--accent)}
  .md table{border-collapse:collapse;margin:0 0 12px;display:block;overflow-x:auto;font-size:13px}
  .md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
  .md th{background:var(--chip)}
  .md strong{font-weight:600}
  .md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  .md > :last-child{margin-bottom:0}
  /* The tiny renderer leaves a stray <br> after a rule and empty <p>s around headings. */
  .md hr + br,.md p:empty{display:none}

  /* The agent's own to-do list. */
  ul.todo{list-style:none;margin:0;padding:0}
  ul.todo li{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:14px;color:var(--muted)}
  ul.todo .mark{font-family:var(--mono);font-size:12px;flex:none;width:14px}
  li.completed_ .mark{color:var(--done)} li.completed_ span:last-child{text-decoration:line-through;opacity:.7}
  li.in_progress .mark{color:var(--accent)} li.in_progress span:last-child{color:var(--fg);font-weight:600}

  details.acts-t{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  details.acts-t summary{cursor:pointer;list-style:none;display:flex;align-items:center;min-height:44px;
    padding:8px 14px;font-size:14px;font-weight:500;color:var(--accent)}
  details.acts-t summary::-webkit-details-marker{display:none}
  details.acts-t summary::before{content:"\25b8";display:inline-block;width:14px;color:var(--muted);transition:transform .12s}
  details.acts-t[open] summary::before{transform:rotate(90deg)}
  details.acts-t .acts{padding:0 14px 12px;overflow-wrap:anywhere}
  .acts{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.75}
  .acts b{color:var(--fg);font-weight:600}

  /* ---------------------------------------------------------------- phone */
  @media (max-width:1100px){ .cols,.cols.five{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:820px){
    .cols,.cols.five{grid-template-columns:minmax(0,1fr)}
    .detail{padding:16px;min-height:0}
    .actions{margin-left:0;width:100%}
  }
  @media (max-width:420px){
    h1{font-size:24px}
    .hub{padding:10px 14px}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="titlebar">
    <h1>Agents</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="livetext">live</span></span>
    <div class="actions">
      <button class="tog" id="routines" type="button" aria-pressed="false">Hide Routines</button>
      <button class="tog" id="completed" type="button" aria-pressed="false">Show Completed</button>
      <a class="hub" id="hub" hidden target="_blank" rel="noopener">To-Do Hub ↗</a>
      <span class="counts" id="count"></span>
    </div>
  </div>
</header>

<main class="board">
  <nav class="cols" id="cols" aria-label="Sessions"></nav>
  <section class="detail" id="detail" aria-live="polite">
    <div class="d-empty">Select an agent to see what it's doing.</div>
  </section>
</main>

</div>

<script>
const $ = (id) => document.getElementById(id);
let state = { sessions: [] };
let selected = null, detail = null, detailFor = null;
// Re-renders happen every second (list) and on every hook event (detail), so
// toggles, expanded columns and each column's scroll position live outside the DOM.
let actsOpen = false;
const expanded = new Set(), scrolls = {};
// Routines (scheduled tasks: health checks, hub checks) are hidden unless Paul
// asks for them. Remembered per browser; a blocked storage just means the default.
let hideRoutines = true;
try { hideRoutines = localStorage.getItem('agents.hideRoutines') !== '0'; } catch {}
// Completed (the agent ended with the archive sentence; only archiving is left)
// is a fifth column, hidden until asked for. Remembered the same way.
let showCompleted = false;
try { showCompleted = localStorage.getItem('agents.showCompleted') === '1'; } catch {}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ms){
  if (ms == null) return '';
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 60) return s+'s';
  const m = Math.floor(s/60); if (m < 60) return m+'m';
  const h = Math.floor(m/60); return h+'h'+(m%60?' '+(m%60)+'m':'');
}
let HOME='';   // filled from the server, so no machine's path is baked in
function prettyPath(p){ if(!p) return ''; let o=p.startsWith(HOME)?'~'+p.slice(HOME.length):p;
  return o.length>52 ? o.slice(0,22)+'…'+o.slice(-27) : o; }
function projectOf(s){
  if (s.project) return s.project;
  const c = s.cwd || '';
  if (/^\/(private\/)?var\/folders\//.test(c) || c.startsWith('/tmp')) return 'scratch';
  return c ? c.split('/').filter(Boolean).pop() : 'unknown';
}
// The chat-window title if the app knows one; otherwise the task; otherwise the folder.
function nameOf(s){ return s.title_session || s.title || projectOf(s); }

// Escape-then-structure markdown. Deliberately small: no dependencies allowed,
// this page must render identically with no network.
function md(src){
  if (!src) return '';
  const blocks = [];
  let t = esc(src).replace(/```([\s\S]*?)```/g, (_, code) => {
    blocks.push(code.replace(/^[a-zA-Z0-9]*\n/, ''));
    return `\u0000${blocks.length - 1}\u0000`;
  });
  t = t.replace(/^\s*(?:---|___|\*\*\*)\s*$/gm, '<hr>');
  t = t.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>')
       .replace(/^##\s+(.*)$/gm, '<h2>$1</h2>')
       .replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
  t = t.replace(/(?:^&gt;\s?.*(?:\n|$))+/gm, (m) =>
    '<blockquote>' + m.split('\n').filter(Boolean).map(l => l.replace(/^&gt;\s?/, '')).join('<br>') + '</blockquote>');
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  // Pipe tables — agents emit these constantly, and raw pipes are unreadable.
  t = t.replace(/^\|.*\|[ \t]*\n\|[ \t:|-]+\|[ \t]*\n(?:\|.*\|[ \t]*(?:\n|$))*/gm, (m) => {
    const rows = m.trim().split('\n').map(r => r.trim());
    const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    return '<table><thead><tr>' + head.map(h => `<th>${h}</th>`).join('') +
           '</tr></thead><tbody>' +
           body.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') +
           '</tbody></table>';
  });
  t = t.replace(/^(?:[-*]|\d+\.)\s+.*(?:\n(?:[-*]|\d+\.)\s+.*)*/gm, (m) => {
    const ordered = /^\d/.test(m.trim());
    const items = m.split('\n').map(l => l.replace(/^(?:[-*]|\d+\.)\s+/, '').trim())
                   .filter(Boolean).map(i => `<li>${i}</li>`).join('');
    return ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`;
  });
  t = t.split(/\n{2,}/).map(p => {
    const x = p.trim();
    if (!x) return '';
    return /^<(h\d|ul|ol|blockquote|pre|hr|table)/.test(x) ? x : `<p>${x.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${blocks[i]}</code></pre>`);
}

const SECTIONS = [
  // It asked you something, or its last reply lists to-do items for you.
  { key:'needsInput', label:'Needs Input',   cls:'needs', pill:'w'  },
  // Turn over, no to-dos, nothing running: read it. Finished ones stay here an hour.
  { key:'ready',      label:'Ready for You', cls:'ready', pill:'ok' },
  { key:'working',    label:'Working',       cls:'',      pill:''   },
  // Turn over, but something it started will wake it again: CI, a run, a side session.
  { key:'background', label:'Background',    cls:'bg',    pill:'m'  },
  // Ended with the archive sentence, no to-dos, over an hour ago. Only shown on request.
  { key:'completed',  label:'Completed',     cls:'done',  pill:'m'  },
];
const LABEL = Object.fromEntries(SECTIONS.map(x => [x.key, x.label]));
const ROWCLS = { needsInput:'needs', ready:'ready', working:'', background:'bg', completed:'done' };
const SHOW = 5;   // rows a column shows before it scrolls

// A routine waiting on a permission prompt still shows: it is stuck until you answer.
const visible = () => (state.sessions || []).filter(s => !hideRoutines || !s.routine || s.blocked);
// To-dos are markdown; a row shows plain text, so "[Kit](https://…)" reads "Kit".
const plain = (x) => String(x).replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '');
const firstTodo = (s) => s.todos?.length ? plain(s.todos[0]) + (s.todos.length > 1 ? ` (+${s.todos.length - 1} more)` : '') : '';

// The second line: what you need to do, why it is waiting, or what it did.
function subOf(s){
  if (s.todos?.length) return '→ ' + firstTodo(s);
  if (s.group === 'background' && s.why) return s.why;
  // A prompt that opens with an app notice ("<system-reminder> …") says nothing useful.
  const asked = s.title && !s.title.trimStart().startsWith('<') ? s.title : '';
  return s.statusDetail || asked || (projectOf(s) + (s.branch ? ' · ' + s.branch : ''));
}

function rowHtml(s, t){
  return `
    <button class="row ${s.id===selected?'on':''} ${s.blocked?'blocked':''} ${ROWCLS[s.group]||''} ${s.live?'':'stale'}"
            data-id="${esc(s.id)}" title="${esc(projectOf(s) + (s.branch ? ' · ' + s.branch : '') + (s.live ? '' : ' (no live signal)'))}">
      <div class="r1">
        <span class="sd"></span>
        <span class="name">${esc(nameOf(s))}</span>
        ${s.blocked?'<span class="pill w">Permission</span>':''}
        ${s.routine?'<span class="tag">Routine</span>':''}
        <span class="ago">${ago(t-(s.stateAt||s.lastSeen))}</span>
      </div>
      <div class="r2">${esc(subOf(s))}</div>
    </button>`;
}

function renderList(){
  const all = state.sessions || [], list = visible(), t = Date.now();
  const n = (k) => list.filter(s => s.group === k).length;
  const needs = n('needsInput'), ready = n('ready'), working = n('working'), bg = n('background');
  $('count').innerHTML = `<b>${needs}</b> need you · <b>${ready}</b> ready · <b>${working}</b> working · <b>${bg}</b> background`;
  document.title = needs ? `(${needs}) Agents — need you` : ready ? `(${ready}) Agents — ready` : working ? `${working} working · Agents` : 'Agents';

  const routines = all.filter(s => s.routine).length;
  const rb = $('routines');
  rb.hidden = !routines;
  rb.textContent = hideRoutines ? `Show Routines (${routines})` : 'Hide Routines';
  rb.setAttribute('aria-pressed', String(!hideRoutines));
  const done = n('completed');
  const cb = $('completed');
  cb.textContent = showCompleted ? 'Hide Completed' : `Show Completed (${done})`;
  cb.setAttribute('aria-pressed', String(showCompleted));

  // This runs every second, so keep each column where it was scrolled to.
  document.querySelectorAll('#cols .rows').forEach(r => { scrolls[r.dataset.key] = r.scrollTop; });

  const shown = SECTIONS.filter(sec => sec.key !== 'completed' || showCompleted);
  $('cols').classList.toggle('five', shown.length === 5);
  $('cols').innerHTML = shown.map(sec => {
    const rows = list.filter(s => s.group === sec.key);
    const open = expanded.has(sec.key);
    const body = rows.length ? rows.map(s => rowHtml(s, t)).join('') : '<div class="none">Nothing here</div>';
    const more = rows.length > SHOW
      ? `<button class="more" type="button" data-key="${sec.key}" aria-expanded="${open}">${open ? 'Show Fewer ▴' : `Show All ${rows.length} ▾`}</button>`
      : '';
    return `<section class="group ${sec.cls}" aria-label="${sec.label}">
      <div class="gh"><span class="t">${sec.label}</span><span class="pill ${sec.pill}">${rows.length}</span></div>
      <div class="rows ${open?'open':''}" data-key="${sec.key}">${body}</div>${more}</section>`;
  }).join('');

  // Cap a collapsed column at exactly five rows, measured rather than guessed.
  document.querySelectorAll('#cols .rows').forEach(r => {
    const rs = r.querySelectorAll('.row');
    if (!r.classList.contains('open') && rs.length > SHOW)
      r.style.maxHeight = (rs[SHOW].offsetTop - rs[0].offsetTop) + 'px';
    r.scrollTop = scrolls[r.dataset.key] || 0;
  });

  $('cols').querySelectorAll('.row').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.id)));
  $('cols').querySelectorAll('.more').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key;
    if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
    scrolls[k] = 0;
    renderList();
  }));
}

$('routines').addEventListener('click', () => {
  hideRoutines = !hideRoutines;
  try { localStorage.setItem('agents.hideRoutines', hideRoutines ? '1' : '0'); } catch {}
  renderList();
});
$('completed').addEventListener('click', () => {
  showCompleted = !showCompleted;
  try { localStorage.setItem('agents.showCompleted', showCompleted ? '1' : '0'); } catch {}
  renderList();
});

const narrow = window.matchMedia('(max-width:820px)');

async function select(id){
  if (id !== selected) actsOpen = false;
  selected = id; detail = null; renderList(); renderDetail();
  // The detail sits under the columns. If it starts below the fold, bring it
  // into view — again once the transcript arrives, as the empty card is short.
  const reveal = () => {
    if (selected !== id) return;
    const top = $('detail').getBoundingClientRect().top;
    if (narrow.matches || top > window.innerHeight - 160)
      $('detail').scrollIntoView({ behavior:'smooth', block:'start' });
  };
  reveal();
  try {
    const r = await fetch('/api/session/'+encodeURIComponent(id));
    if (selected === id){ detail = await r.json(); detailFor = id; renderDetail(); reveal(); }
  } catch {}
}

function renderDetail(){
  const s = (state.sessions||[]).find(x => x.id === selected);
  const el = $('detail');
  if (!s){ el.innerHTML = '<div class="d-empty">Select an agent to see what it&rsquo;s doing.</div>'; return; }
  const d = detailFor === selected ? detail : null;

  const askText = s.ask || null;
  const qs = d?.question || null;
  const askBlock = (qs || askText) ? `
    <div class="block"><h3>Waiting on your answer</h3>
      <div class="ask">${qs ? qs.map(q => `
        <div class="q">${esc(q.question)}</div>
        ${q.options.map((o,i) => `<div class="opt"><span class="k">${i+1}</span><span><b>${esc(o.label)}</b>${o.description?' — '+esc(o.description):''}</span></div>`).join('')}
      `).join('<hr>') : `<div class="q">${esc(askText)}</div>`}</div>
    </div>` : '';

  const todos = d?.todos?.length ? `
    <div class="block"><h3>Its to-do list</h3><ul class="todo">${d.todos.map(t=>{
      const m = t.status==='completed'?'✓':t.status==='in_progress'?'▸':'○';
      return `<li class="${t.status==='completed'?'completed_':t.status}"><span class="mark">${m}</span><span>${esc(t.content)}</span></li>`;
    }).join('')}</ul></div>` : '';

  // No heading here: this is the bulk of the panel and the label was just noise.
  const said = d?.lastAssistant ? `
    <div class="block reply"><div class="md">${md(d.lastAssistant)}</div></div>` : '';

  const asked = (d?.lastPrompt || s.title) ? `
    <div class="block"><h3>What you asked</h3><div class="md">${md(d?.lastPrompt || s.title)}</div></div>` : '';

  const acts = d?.activity?.length ? `
    <div class="block"><details class="acts-t" id="actsT" ${actsOpen?'open':''}><summary>Recent actions (${d.activity.length})</summary>
      <div class="acts">${d.activity.map(a=>`<b>${esc(a.tool)}</b>${a.detail?' — '+esc(a.detail):''}`).join('<br>')}</div>
    </details></div>` : '';

  const pillCls = (SECTIONS.find(x => x.key === s.group) || {}).pill || '';
  // The app's own link to a session, as its session list hands out. Verified
  // 2026-10-16: opening it brings that session forward in the Claude window.
  const open = s.localId
    ? `<a class="launch" href="claude://claude.ai/epitaxy/${encodeURIComponent(s.localId)}">Open in Claude ↗</a>` : '';
  const why = s.todos?.length
    ? `<div class="d-why"><b>Your to-dos:</b><ul class="d-todos">${s.todos.map(x => `<li>${md(x).replace(/^<p>|<\/p>$/g, '')}</li>`).join('')}</ul></div>`
    : s.group==='background' && s.why ? `<div class="d-why"><b>Waiting on:</b> ${esc(s.why)}</div>` : '';
  el.innerHTML = `
    <div class="d-head"><h2 class="d-title">${esc(nameOf(s))}</h2>
      <span class="pill ${pillCls}">${esc(LABEL[s.group] || s.state)} · ${ago(Date.now()-(s.stateAt||s.lastSeen))}</span>${open}</div>
    ${why}
    <div class="d-sub">${esc(projectOf(s))}${s.branch?' · '+esc(s.branch):''} · ${esc(prettyPath(s.cwd))}</div>
    ${askBlock}${asked}${said}${todos}${acts}`;

  const at = $('actsT');
  if (at) at.addEventListener('toggle', () => { actsOpen = at.open; });
}

function render(){ renderList(); renderDetail(); }

// The hub link comes from config.json via the server, so no private address is
// baked into this page.
function showHub(url){
  const a = $('hub');
  if (url && /^https:\/\//.test(url)) { a.href = url; a.hidden = false; } else a.hidden = true;
}

let es;
function connect(){
  es = new EventSource('/stream');
  es.onopen = () => { $('dot').classList.remove('off'); $('livetext').textContent='live'; };
  es.onmessage = (e) => { try { state = JSON.parse(e.data); if (state.home) HOME = state.home; showHub(state.hubUrl); render(); } catch {} };
  es.onerror = () => { $('dot').classList.add('off'); $('livetext').textContent='disconnected';
    try{es.close();}catch{} setTimeout(connect, 2000); };
}
connect(); setInterval(renderList, 1000); render();
</script>
</body>
</html>
